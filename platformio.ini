; ESP8266 D1 mini MQTT button
; - d1_mini : firmware for the board
; - native  : host unit tests of the hardware independent logic (src/logic)

[platformio]
default_envs = d1_mini

[env]
build_flags =
    -D FW_VERSION=\"1.0.0\"
    -Wall -Wextra

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -I src/logic
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<logic/>
build_flags =
    ${env.build_flags}
    -std=c++17
    -I src/logic
